# Render Blueprint: one free web service that serves the game and the
# co-op relay. Deploy with the "Deploy to Render" button in README.md.
services:
  - type: web
    name: vampire-thing
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
